# CybrWire Curated Sources
# Official, trusted threat intelligence feeds
# Comprehensive collection covering government, academic, commercial, and community sources
#
# Each feed has a kind, which decides where its items appear (press 4 in the app):
#   advisory    - vulnerability and patch advisories ("what do I patch?")
#   news        - news and research ("what's happening?"); the default
#   ransomware  - ransomware victim claims ("who's getting hit?")
#   indicators  - malicious IPs, URLs and hashes ("what do I block?"); shown in their own view
curated:
  # === GOVERNMENT & OFFICIAL SOURCES ===
  - name: "ACSC Alerts"
    url: "https://www.cyber.gov.au/rss/alerts"
