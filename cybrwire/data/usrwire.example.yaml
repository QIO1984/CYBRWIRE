# YOUR CYBRWIRE SETTINGS
# ============================================================================
# This file is yours: git ignores it, and it lives next to the app as usrwire.yaml.
#
# Keys never go in here. Press Shift+K in the app to enter and test API keys,
# notification targets and feed keys, and to choose your AI provider and model.
#
# The feeds that ship with CybrWire are in cybrwire.yaml and community.yaml.
# Uncomment any section below that you want to use.

# WATCHLIST: vendors, products or keywords you care about. Matching items get a
# star, and w shows only those. Whole words in titles and descriptions, in any case;
# a trailing * matches a prefix. Shift+W in the app does the same without this file.
#
# watchlist:
#   - Fortinet
#   - citrix*
#   - CVE-2024-3400

# NOTIFICATIONS: which events send a message to the targets set with Shift+K.
# Any of: watchlist, confirmed (newly on an official exploited list), kev, zeroday
# The default is watchlist and confirmed.
#
# notifications:
#   triggers: [watchlist, confirmed, zeroday]

# AI: only for what the app doesn't ask for. true = a new briefing at every launch,
# which is one paid call each time.
#
# ai:
#   auto_briefing: false

# WORLD CLOCK: the line under the title shows your local time and the cities below.
# Your own zone: TZ in the environment wins, then this setting, then your computer's zone.
# timezone: America/New_York
#
# To choose your own cities, uncomment 'clocks:' and the cities you want (one prominent city per time
# zone, west to east). Only your list is used, so keep any default you still want. Any tz database
# name works, like Europe/Paris. Leave it all commented to get the defaults. Restart after changing.
#
# clocks:
#   - "HNL: Pacific/Honolulu"           # UTC-10
#   - "ANC: America/Anchorage"          # UTC-9
#   - "LAX: America/Los_Angeles"        # UTC-8  (default)
#   - "DEN: America/Denver"             # UTC-7
#   - "CHI: America/Chicago"            # UTC-6
#   - "NYC: America/New_York"           # UTC-5  (default)
#   - "SAO: America/Sao_Paulo"          # UTC-3
#   - "UTC: UTC"                        # UTC
#   - "LON: Europe/London"              # UTC  (default)
#   - "ROM: Europe/Rome"                # UTC+1  (default)
#   - "CAI: Africa/Cairo"               # UTC+2
#   - "SPB: Europe/Moscow"              # UTC+3  (default)
#   - "THR: Asia/Tehran"                # UTC+3:30
#   - "DXB: Asia/Dubai"                 # UTC+4
#   - "KHI: Asia/Karachi"               # UTC+5
#   - "DEL: Asia/Kolkata"               # UTC+5:30
#   - "DAC: Asia/Dhaka"                 # UTC+6
#   - "BKK: Asia/Bangkok"               # UTC+7
#   - "SHA: Asia/Shanghai"              # UTC+8
#   - "TYO: Asia/Tokyo"                 # UTC+9  (default)
#   - "SYD: Australia/Sydney"           # UTC+10
#   - "AKL: Pacific/Auckland"           # UTC+12

# YOUR OWN FEEDS: type is rss, json or txt (or status, for a service's status page, with kind outage).
# kind decides where items appear: advisory, news (the default), ransomware, indicators or outage.
# If a feed needs a key, name how it is sent and the key card gets a row for it:
#   key_header: the HTTP header that carries the key
#   key_param:  the URL parameter that carries the key
#
# custom:
#   - name: "Security Blog"
#     url: "https://example.com/feed.rss"
#     type: rss
#
#   - name: "AlienVault OTX - Subscribed Pulses"
#     url: "https://otx.alienvault.com/api/v1/pulses/subscribed?limit=10"
#     type: json
#     key_header: X-OTX-API-KEY
#
#   - name: "Threat API"
#     url: "https://api.example.com/threats.json"
#     type: json
#     key_param: key
#
# Feeds that are fine in a browser but turn away automated clients can be added here if they work for you.
# Example: the Australian Cyber Security Centre, left out of the defaults because it never answered CybrWire.
#   - name: "ACSC Alerts"
#     url: "https://www.cyber.gov.au/rss/alerts"
#     type: rss
#     kind: advisory
