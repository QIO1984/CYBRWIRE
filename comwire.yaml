# Community Curated Sources
# Crowdsourced feeds contributed via GitHub
# To contribute, submit a PR at: https://github.com/QIO1984/CYBRWIRE
#
# CONTRIBUTION GUIDELINES:
# 1. Add your feed with a unique name and a valid RSS, JSON or TXT feed URL
# 2. Never put an API key in this file. If the feed needs one, add key_header or
#    key_param (how the key is sent), and users enter theirs in the app with Shift+K
# 3. Include your GitHub handle or nickname as a comment
# 4. Add a comment saying where to get the key
#
# EXAMPLE WITH API KEY:
# - name: "Example Threat Feed"
#   url: "https://api.example.com/threats.json"
#   type: "json"
#   key_param: "key"
#   # Contributed by: @github_username
#   # Get API key: https://example.com/register
#   # Note: Free tier includes 100 requests/day
#
