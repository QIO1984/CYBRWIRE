# Production Configuration - API Keys and Custom Feeds
# ============================================================================
# 
# This file is NOT in .gitignore - keep it safe!
# For LOCAL use and testing with PRIVATE API KEYS, create and use cybrwire_local.yaml instead
# (cybrwire_local.yaml IS in .gitignore and will never be committed)
# If you aren't using local overrides, add your keys here but be advised if you push to GitHub
# they will be public. Keys in cybrwire_local.yaml take priority over keys here.
#
# Add your API keys and custom feeds below

# ==============================================================================
# ENRICHMENT API KEYS
# ==============================================================================
# Configure these keys to enable IOC enrichment in the API Tools panel
#
# Get free API keys from the providers listed below and paste them between the quotes
# Example: abuseipdb_api_key: "your_actual_api_key_here"
#
# If you don't want to use a provider, just leave it empty: abuseipdb_api_key: ""

# ==============================================================================
# AI PROVIDER (War Room briefings and alert explanations)
# ==============================================================================
# Optional. Choose ONE provider: uncomment the ai: line and one example block,
# then fill in your key. Alerts in the current data window are sent to that
# provider when you press g (briefing) or a (explain alert); nothing is sent
# on launch unless auto_briefing is true.
#
# ai:
#   # Anthropic Claude - key: https://console.anthropic.com/
#   provider: "anthropic"
#   api_key: "your-anthropic-key"
#   model: "claude-haiku-5-5"      # or claude-sonnet-5-5 / claude-opus-5-5 (default if blank)
#
#   # Google Gemini - key: https://aistudio.google.com/apikey
#   provider: "gemini"
#   api_key: "your-gemini-key"
#   model: ""                      # blank = gemini-flash-latest
#
#   # OpenAI - key: https://platform.openai.com/
#   provider: "openai"
#   api_key: "your-openai-key"
#   model: "your-model-id"         # required
#
#   # OpenRouter - key: https://openrouter.ai/
#   provider: "openrouter"
#   api_key: "your-openrouter-key"
#   model: "provider/model-id"     # required
#
#   # Ollama - models running on your own machine, no key, no data leaves it
#   provider: "ollama"
#   model: "llama3.1"              # required; base_url defaults to http://localhost:11434/v1
#
#   # Any OpenAI-compatible server (LM Studio, vLLM, Groq...)
#   provider: "openai_compatible"
#   base_url: "http://localhost:1234/v1"
#   api_key: ""                    # if the server needs one
#   model: "your-model-id"
#
#   auto_briefing: false           # true = new briefing at every launch (one call each time)

enrichment:
  # AbuseIPDB - IP reputation and abuse history lookups
  # Get your free API key at: https://www.abuseipdb.com/api
  abuseipdb_api_key: ""

  # VirusTotal - Hash, URL, and domain analysis
  # Get your free API key at: https://www.virustotal.com/
  virustotal_api_key: ""

  # Pulsedive - Multi-indicator threat intelligence platform
  # Get your free API key at: https://pulsedive.com/
  pulsedive_api_key: ""

  # Abuse.ch - Malware hash and phishing URL databases
  # Visit: https://abuse.ch/ (some features are free, no API key needed)
  abuse_ch_api_key: ""

# ==============================================================================
# CUSTOM THREAT FEEDS
# ==============================================================================
# Add your custom threat intelligence feeds below
# These will appear under "Custom" in the sources breakdown and feed statistics
#
# Supports: RSS, JSON, and text list formats
#
# Examples:
#   RSS Feed:
#     - name: "Security Blog"
#       url: "https://example.com/feed.rss"
#       type: "rss"
#
#   JSON Feed:
#     - name: "Threat API"
#       url: "https://api.example.com/threats.json?key=YOUR_KEY"
#       type: "json"
#
#   Text/IP List:
#     - name: "Malicious IPs"
#       url: "https://example.com/ips.txt"
#       type: "txt"

custom:
  # Add your custom feeds here
  # Uncomment and modify the examples below, or add your own
  # - name: "My Custom Feed"
  #   url: "https://example.com/feed.json"
  #   type: "json"
