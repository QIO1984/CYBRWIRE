# Custom feeds, watchlist and settings
# ============================================================================
#
# This file is tracked by git, so NEVER put API keys or webhook URLs here.
# Press Shift+K in the app to enter and test them: they go to your system keychain.
# On servers and in containers, use environment variables such as CYBRWIRE_NVD_API_KEY.
# For private settings, copy this file to cybrwire_local.yaml, which git ignores.

# ==============================================================================
# WATCHLIST
# ==============================================================================
# Vendors, products or keywords you care about. Matching items get a star, and w
# shows only those. Matches whole words in titles and descriptions, in any case; a
# trailing * matches a prefix.
# Terms here and in cybrwire_local.yaml are combined. You can also press Shift+W in
# the app. To keep your list private, put it in cybrwire_local.yaml.
#
# watchlist:
#   - Fortinet
#   - citrix*
#   - CVE-2024-3400

# ==============================================================================
# NOTIFICATIONS
# ==============================================================================
# Optional push messages while the app runs. Add the targets with Shift+K in the
# app; their URLs work like passwords. triggers can be any of: watchlist (the
# default), kev, zeroday. Test with: python3 cybrwire.py --test-notify
#
# notifications:
#   triggers: [watchlist, kev]

# ==============================================================================
# AI PROVIDER (War Room briefings and alert explanations)
# ==============================================================================
# Optional. Choose ONE provider and put this in cybrwire_local.yaml, then add its
# key with Shift+K. Alerts in the current data window are sent to that provider
# when you press g (briefing) or a (explain alert); nothing is sent on launch
# unless auto_briefing is true.
#
# ai:
#   provider: "anthropic"          # anthropic | gemini | openai | openrouter | ollama | openai_compatible
#   model: "claude-haiku-5-5"      # or claude-sonnet-5-5 / claude-opus-5-5 (default if blank)
#                                  # gemini default: gemini-flash-latest
#                                  # openai, openrouter, ollama and openai_compatible need a model
#   base_url: ""                   # openai_compatible (LM Studio, vLLM, Groq...), e.g. http://localhost:1234/v1
#                                  # ollama defaults to http://localhost:11434/v1 and needs no key
#   auto_briefing: false           # true = new briefing at every launch (one call each time)

# ==============================================================================
# CUSTOM THREAT FEEDS
# ==============================================================================
# Add your custom threat intelligence feeds below
# These will appear under "Custom" in the sources breakdown and feed statistics
#
# Supports: RSS, JSON, and text list formats
#
# Examples:
#   RSS Feed:
#     - name: "Security Blog"
#       url: "https://example.com/feed.rss"
#       type: "rss"
#       kind: "news"          # advisory | news | ransomware | indicators
#
#   JSON Feed:
#     - name: "Threat API"
#       url: "https://api.example.com/threats.json"
#       type: "json"
#
#   Text/IP List:
#     - name: "Malicious IPs"
#       url: "https://example.com/ips.txt"
#       type: "txt"           # text lists always show under Indicators

custom:
  # Add your custom feeds here
  # Uncomment and modify the examples above, or add your own
  # - name: "My Custom Feed"
  #   url: "https://example.com/feed.json"
  #   type: "json"
